<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字养成游戏 · Web</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<h1 id="game-title">文字养成游戏（Web 演示）<span id="modebadge"></span></h1>
<div id="notice"></div>

<!-- E-3/E-4：选卡屏。开局前先选"哪张卡 + 跟主线走还是自由探索" -->
<section id="picker">
  <p id="picker-hint">正在读取世界包目录……</p>
  <div id="packs"></div>
  <div id="moderow">
    <span class="t">游玩模式：</span>
    <label><input type="radio" name="mode" value="story" checked> 跟着主线走（关键节点由引擎接管）</label>
    <label><input type="radio" name="mode" value="free"> 自由探索（不触发主线节点）</label>
  </div>
  <div id="saverow">
    <button id="startBtn" onclick="startGame()" disabled>开始这一局</button>
    <span class="t">　或读取存档：</span>
    <select id="saveSel"></select>
    <button onclick="doLoad()">读取</button>
  </div>
</section>

<!-- 游戏屏 -->
<main id="game" hidden>
<div id="story" class="only-current"><div class="entry">（正在开局……）</div></div>
<div id="gen"></div>
<div id="prompt"></div>
<div id="choices"></div>
<div id="inputrow">
  <input id="in" placeholder="说些什么……（回车发送）">
  <button onclick="say()">发言</button>
  <button id="historyBtn" onclick="toggleHistory()">剧情回顾</button>
  <button onclick="doSave()">存档</button>
  <button onclick="newGame()">换一张卡</button>
</div>
<div id="status"></div>
</main>

<script>window.__GAME_FREE_INPUT__ = "__FREE_INPUT__";</script>
<script src="/static/app.js"></script>
</body>
</html>
