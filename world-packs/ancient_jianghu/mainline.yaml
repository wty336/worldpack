# 主线大纲：节点链（见 design.md §6）
nodes:
  - id: n1_first_meeting
    title: 初遇
    when: {all: []}          # 恒真：开场即触发
    goal: 与沈清秋结识
    completion:
      flags: {met_shen: true}
    on_enter:
      scene: 长安城·沈府门前
      present: [shen_qingqiu]
      briefing: |
        沈清秋在沈府门前被纨绔子弟纠缠，你出手相助，由此与她结识。
        本节点目标：与沈清秋结识（完成信号 flag: met_shen）。
    critical_choices:
      - id: how_to_help
        prompt: 几个纨绔正纠缠一位姑娘。你如何解围？
        options:
          - {text: 挺身而出，护在女子身前, effects: {flags: {met_shen: true}, affections: {shen_qingqiu: 3}}}
          - {text: 拱手上前，以理劝解, effects: {flags: {met_shen: true}, affections: {shen_qingqiu: 2}}}
          - {text: 静观其变，寻机相助, effects: {flags: {met_shen: true}, affections: {shen_qingqiu: 1}}}
    free_scope: 解围方式自由发挥；结识后本节点即完成，进入日常阶段，等待诗会节点触发。

  - id: n2_poetry_festival
    title: 七夕诗会
    when:
      all:
        - {day: {gte: 5}}
        - {flags: {met_shen: true}}
    goal: 参加七夕诗会并决出结果
    completion:
      flags: {poetry_resolved: true}
    on_enter:
      scene: 长安城·曲江池畔
      present: [shen_qingqiu]
      briefing: |
        七夕之夜，曲江池畔诗会，才子云集。你与沈清秋同游。
        诗会上，众人起哄推举你上台应战。
        本节点目标：诗会决出结果（完成信号 flag: poetry_resolved）。
        登台夺魁可进入前三（poetry_top3）；婉拒则沈清秋代战，你无缘前三。
    critical_choices:
      - id: poetry_choice
        prompt: 诗会上，众人起哄推举你上台应战。你如何抉择？
        options:
          - {text: 欣然登台，咏月抒怀, effects: {flags: {poetry_join: true, poetry_top3: true, poetry_resolved: true}, stats: {charm: 2}, affections: {shen_qingqiu: 3}}}
          - {text: 欣然登台，咏剑言志, effects: {flags: {poetry_join: true, poetry_top3: true, poetry_resolved: true}, stats: {martial: 2}, affections: {shen_qingqiu: 2}}}
          - {text: 婉拒，请沈清秋代战, effects: {flags: {poetry_join: false, poetry_resolved: true}, affections: {shen_qingqiu: 2}}}
    free_scope: 诗会期间的对话、作诗内容由剧情自由生成；结果由你的抉择决定。
