name: 江湖旧梦
era: 大盛王朝·长安城（架空，唐风）
start_scene: 长安城·东市
player_role: 初入长安的江湖游侠，身负师门旧事，一身布衣、一柄旧剑
player_goal: 在长安立足，查明师父旧事，守护想守护的人

# 批次 D 试点：地点表——声明后场景是引擎真值，叙事中的移动须经 change_scene
# 工具提议（白名单 + reason），状态栏 <scene> 与 lore 命中随所在地点联动
locations:
  - {id: east_market, name: 长安城·东市, keys: [东市], description: 长安最热闹的坊市，打工与打探消息的去处}
  - {id: shen_gate, name: 长安城·沈府门前, keys: [沈府, 门前], description: 沈府正门，初遇沈清秋之地}
  - {id: shen_mansion, name: 长安城·沈府, keys: [沈府, 偏院, 书斋], description: 沈府内院，拜访沈清秋时所在}
  - {id: back_mountain, name: 长安城郊·后山, keys: [后山, 崖壁], description: 城郊山崖，崖壁有前人剑诀刻痕}
  - {id: qujiang, name: 长安城·曲江池畔, keys: [曲江, 诗会], description: 长安胜景，七夕诗会所在地}

core_rules:
  - 玩家是初入江湖的游侠，因缘际会来到长安
  - 武功以修炼与实战切磋提升
  - 银两是通用货币，可打工赚取

style_guide:
  - 古风白话，克制典雅，不堆砌辞藻
  - 旁白用第三人称，简短有力
  - 对话贴合人物语气，沈清秋言辞婉转、偶用诗词

forbidden:
  - 现代事物（手机、微信、汽车、互联网、照片等）
  - 现代流行语与网络用语
  - 超越时代背景的知识概念（相对论、DNA、人工智能等）
  - 不可让任何角色说破自己是"角色"或"AI"，不可提及玩家、作者、游戏

opening: |
  大盛王朝，长安城，天下首善之地。
  你是一个初入长安的江湖游侠——一柄旧剑，几两碎银，还有一桩师门旧事压在心头。
  此行的目的有二：在长安立足，查明师父的旧事。
  长安三月，柳絮纷飞。
  你背着行囊，踏入了这座天下最繁华的城池。
  江湖的故事，就从这里开始。

# B1：Lorebook 条目——带触发关键词的世界设定，按需注入（不进静态前缀）
lore:
  - {id: dongshi, keys: [东市], text: 东市是长安最热闹的坊市，商贾云集，西域胡商的驼队常在此卸货交易。}
  - {id: xishi, keys: [西市], text: 西市多胡商店铺，香料、琉璃、胡饼应有尽有，价钱比东市便宜三分。}
  - {id: shen_jia, keys: [沈家, 沈府, 沈清秋], text: 沈家是长安书香门第，家主沈祭酒在朝为官，膝下一女名清秋，才名满京华。}
  - {id: qujiang, keys: [曲江, 曲江池], text: 曲江池是长安胜景，池畔柳色如烟，每逢七夕举办诗会，才子佳人云集。}
  - {id: houshan, keys: [后山], text: 长安城郊后山崖壁有前人刻下的剑法心得，传闻与一桩旧事有关。}
  - {id: shihui, keys: [诗会, 七夕], text: 七夕诗会是长安一年一度的文坛盛事，夺魁者名满京城，还能得彩头赏银。}
