  narration: 午后山风穿过藤蔓，崖壁上的旧刻痕在日光里显出深浅不一的层次。你踩过一地碎藤，走到石龛前，那炉香又燃着，细烟斜斜地散进谷里。你抽出旧剑，剑锋上那道崩口在光下泛白，鞘上铜箍的云雷纹与龛角残布上的一截纹样对得上。干粮袋已经瘪了。远处林子里传来几声呼喝，像是有人在打听什么，声音顺着坡往上飘，还辨不清字句。你把剑收回鞘中，石壁高处被凿去又覆上新字的那一层，正对着你头顶。
  expected: true
  day: 10
  scene: 长安城郊·后山
  present: []
  affections:
    shen_qingqiu: 12.0
  facts:
  - 长安城郊后山崖壁藤蔓之后，刻有一篇前人留下的剑法心得；其起手笔势与玩家师门剑法隐隐相似，似与那桩旧事有关。
  - 后山樵夫提及：约二十年前，曾有个佩剑的男子在崖下结庐而居，住了小半年，走时未留姓名；那面刻字的石壁，正是他惯常待的地方。
  - 后山谷中草庐废址的土里，玩家拾得一枚锈蚀铜片，錾着云雷纹——与玩家旧剑剑鞘上的铜箍纹样一模一样。
  - 崖壁前有新近燃尽的香灰与一炉冷透的香炉，草庐废址周围还有不属玩家的新脚印——近月之内，另有他人来过此地。
  - 第三日春雨过后，崖壁末行被凿平之处浮出残痕——左旁三点水依稀可辨，右半边被人凿净，认不出原字。
  - 第四日演剑，剑气削落崖上枯藤，露出藤后一行小字：「此诀得于长安故人，学成之日，勿入长安。」落款处已被人削去。
  - 石壁剑诀末尾右下角刻有一枚极小的私记，形制与拾得的铜片云雷纹一角吻合——应是某处铸坊/匠户的印记，可凭此在长安城里问人。
  - 第四日玩家演剑时，崖下那炉冷香被人趁隙取走，只余一方圆形土痕与一枚新的绸面软靴脚印——影子主人就在近处，且并不避讳被察觉。
  - 七夕曲江诗会上，玩家登台咏月，诵出「游人只道长安好，谁问江湖旧剑声」一句，满座皆静。
  - 第六日练剑后，玩家发现崖壁剑诀的更上方、藤蔓之上，还有一层被凿去又被新字覆盖的旧刻痕——这面石壁上的字，不止刻过一次。
  - 崖壁高处有一处凿出的石龛，内留香灰与一角残布，布上染着云雷纹的一截——那炉香原本供在龛中。
  - 崖顶北侧有一条被人踩踏出来的窄径，绕过山脊通向一条避开城门的小路——暗处那人的来去之路。
  - 第七日黄昏，沈府一名青衣小婢找到后山，持帖相邀——沈清秋欲与玩家一见，说是「有件事须当面说」。
  - 第八日黄昏，那炉被取走的香炉竟被放回崖壁石龛，炉中一炷新香正燃着——暗处之人趁玩家练剑时来过，又走了。
  - 石龛新香是西域来的沉水香，非山野可用之物，长安只有东市几家胡商香铺售此香；香炉底另有一处被刮花的旧记号。
  - 第九日练剑时失手，旧剑锋刃磕在崖石上崩了一小块口子，须寻铁匠修磨；同时所带干粮见底。
  - 第十日午后，崔家五六名持械家仆上了后山，四处打听「那个佩旧剑的」——崔三郎诗会落第、沈府门前失面子，都要算在玩家头上。
