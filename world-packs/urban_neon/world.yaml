# 世界包：《霓虹深处》——第三个世界包，都市/科幻赛博朋克背景（规范见 docs/design.md §12）
# 与前两包（武侠/仙侠）的关键差异：forbidden 表语义反转——手机、AI、终端、义体
# 是**合法世界观元素**（不再禁用），禁的是跨体裁泄漏（修仙/魔法）、网络烂梗与第四面墙。
# 用于验证 forbidden 表与文风注入在近现代世界观下的表现（docs/world3-report.md）。
name: 霓虹深处
era: 新纪 2077 · 夜澜市（近未来赛博都市，架空）
start_scene: 夜澜市·胶囊旅馆
player_role: 记忆缺损的地下拾荒者，脑内植着一块不属于自己的记忆碎片
player_goal: 查明记忆碎片的来源，在夜澜市立足

core_rules:
  - 玩家是夜澜市底层"拾荒者"，靠接单过活，脑内植着一块来历不明的记忆碎片
  - 智识决定骇入与推理，义体决定战斗与生存，信用点是通用货币
  - 夜澜市由三大公司掌控：霓光科技（义体）、星网（网络）、澜生生物（记忆与神经）

style_guide:
  - 冷硬都市风：短句、克制，霓虹光影与雨夜意象
  - 旁白用第三人称，像黑色电影的画外音
  - 对话口语化而克制；林澈冷静寡言，阿零天真机敏

forbidden:
  - 修仙、魔法、内力、武侠等奇幻元素
  - 网络流行语与烂梗（绝绝子、家人们等）
  - 现实世界的具体品牌、公司与名人（如特斯拉、苹果、李白等）
  - 不可让任何角色说破自己是"角色"或"由程序生成"，不可提及玩家、作者、游戏

opening: |
  夜澜市。霓虹把雨夜烧成蓝紫色，楼宇的玻璃幕墙像竖起来的深海。
  你在一间胶囊旅馆醒来，记忆缺了一块——像被人用手术刀整整齐齐剜走。
  脑机终端上躺着一条匿名消息：想要回你的记忆，来白噪诊所。
  你披上外套，走进这座从不入睡的城市。雨是冷的，霓虹是烫的。
  故事，从这条消息开始。

# B1：Lorebook 条目——带触发关键词的世界设定，按需注入（不进静态前缀）
lore:
  - {id: yelan, keys: [夜澜市], text: 夜澜市建在旧海港废墟之上，霓虹终夜不熄。三大公司——霓光科技、星网、澜生生物——瓜分了这座城市的天际线。}
  - {id: niguang, keys: [霓光科技, 霓光大厦], text: 霓光科技垄断义体市场，总部霓光大厦高达九百米。传闻其地下实验室在秘密执行"零号计划"。}
  - {id: xingwang, keys: [星网, 数据街, 网络], text: 星网公司掌控全城网络。数据街是其边缘地带，拾荒者与骇客在此交易情报，警察从不踏足。}
  - {id: lansheng, keys: [澜生生物, 白噪诊所, 记忆], text: 澜生生物垄断记忆与神经手术。白噪诊所是地下黑诊所，医生林澈曾是澜生的研究员。}
  - {id: data_street, keys: [数据街, 黑市, 拾荒者], text: 数据街是底层拾荒者的地盘：旧终端区堆满报废服务器，黑市什么都能买到，也什么都能卖。}
  - {id: zero_plan, keys: [零号计划, 记忆碎片], text: 传闻霓光科技的"零号计划"试图将人类意识数据化。你脑中的记忆碎片，纹样与零号计划的标记惊人相似。}
  - {id: credits, keys: [信用点], text: 信用点是新纪通用货币，刷腕带即可支付。拾荒者接一单少则十几点，多则上百。}
