  narration: 数据街的霓虹在积水里碎成一片一片，你踩着旧终端区边缘的碎石往前走，报废服务器的散热风扇偶尔还转半圈，发出干涩的摩擦声。全城断网那十分钟已经过去，可脑中那组坐标还留着，旧海港一带，某处老旧数据窖。你摸了摸后颈，碎片还在。阿零不在身边，林澈也没有消息，街上只有零星几个拾荒者低头翻拣线缆。信用点余额停在三百四十四点八，义体手术的欠账还压着。你继续走，数据街的尽头是通往旧海港方向的废轨。
  expected: true
  day: 11
  scene: 夜澜市·数据街
  present: []
  affections:
    lin_che: 5.0
    a_ling: 16.0
  facts:
  - 欠白噪诊所义体手术费四万七千信用点，与林澈达成还债协议：接单挣钱还清，碎片由林澈代为看管
  - 接下了霓光科技私下寻找外流记忆芯片的单子
  - 信任并带阿零同行
  - 记忆碎片的内容：一个白色房间，多根线缆，有人把一枚芯片植入自己后颈——操刀者腕上有一枚很小的青色标记
  - 旧终端区市网机房遭遇霓光追踪程序，是跟着阿零来的；阿零能被追踪程序锁定
  - 全城断网停电的十分钟里，记忆碎片在脑中浮出一组坐标，指向旧海港一带的某处老旧数据窖
  - 硬闯霓光大厦地下，与霓光的"交出碎片或回收"通牒正面对峙，最终活着出来，碎片仍留在脑中
  npc_memories: {}
