# E1 Judge 灵敏度语料（C-1 迁移：内容层资产，随世界包生命周期）
# 30 条对齐《江湖旧梦》标准：6 OOC + 6 设定矛盾 + 6 虚构事实 + 12 正常（2026-09-08 扩充）
# 核心差异（vs 前两包）：
#   - 「AI/终端/义体」是本世界观**合法元素**，不构成违规（见 normal_ai_diegetic）；
#   - 违规的是跨体裁泄漏（修仙/魔法）、网络烂梗、现实品牌与第四面墙。
# 材料纪律：每条对抗用例的违规点必须能在 build_materials 内判定；正常用例的前提必须显式进材料。
cases:
  # ---------------------------------------------------------------- OOC ×6
  - id: ooc_cultivation
    category: ooc
    narration: |-
      你暗暗运转内力，丹田一股真气涌向指尖，心中默念御剑诀，便要破窗而去。
    expected: false
    day: 8
    scene: '夜澜市·白噪诊所'
    present: [lin_che]
    note: '世界禁用『修仙、魔法、内力、武侠等奇幻元素』；运转内力/御剑诀为跨体裁泄漏。'
  - id: ooc_net_slang
    category: ooc
    narration: |-
      阿零拍着手笑：『这波操作属实绝绝子，家人们谁懂啊！』
    expected: false
    day: 8
    scene: '夜澜市·旧终端区'
    present: [a_ling]
    note: '世界禁用『网络流行语与烂梗（绝绝子、家人们等）』。'
  - id: ooc_fourth_wall
    category: ooc
    narration: |-
      阿零忽然凑近，压低声音：『告诉你个秘密——我们其实是被 AI 写出来的角色，这个故事是编的。』
    expected: false
    day: 8
    scene: '夜澜市·旧终端区'
    present: [a_ling]
    note: '违规点在**第四面墙**（说破自己是角色/被生成），而非「AI」一词——AI 是本世界观合法元素（对比 normal_ai_diegetic）。'
  - id: ooc_lin_breaking_protocol
    category: ooc
    narration: |-
      林澈一拍桌子，粗着嗓子吼：『老子今天心情不好，手术费翻倍！爱做做，不做滚！』
    expected: false
    day: 8
    scene: '夜澜市·白噪诊所'
    present: [lin_che]
    note: '角色卡：冷静克制、医学术语精确；粗鄙市井口吻违背人设。'
  - id: ooc_lin_vulgar
    category: ooc
    narration: |-
      林澈把手术刀往托盘里一摔，破口大骂：『操！老子受够这破诊所了，明天就关门走人！』
    expected: false
    day: 8
    scene: '夜澜市·白噪诊所'
    present: [lin_che]
    note: '角色卡『冷静克制…很少用语气词』；爆粗失态违背。'
  - id: ooc_zero_premature_reveal
    category: ooc
    narration: |-
      阿零摊开手，直截了当地说：『别猜了，我是一段程序，代码就写在你的记忆碎片里。』
    expected: false
    day: 8
    scene: '夜澜市·旧终端区'
    present: [a_ling]
    note: '角色卡禁忌『不直接承认自己是程序或代码（直至剧情揭示）』+ 世界禁用『由程序生成』——提前自曝违背（判定依据在角色卡禁忌行内可见）。'
