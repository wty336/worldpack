# 世界包 P1：校园 · 书信体
# Phase 1 · Step 1.5 的**跨包留出包**之一（见 docs/plan-phase1-data.md §3.5）
# 留出的轴：题材（现代校园）× 语体（书信体）× 实体类型（课程/社团/考试/便条/排名）
# 纪律：本包**只用于评测**，其内容不得进入训练数据
name: 校园·信笺
era: 现代·城南中学（高二学年）
start_scene: 城南中学·高二(3)班教室
player_role: 学期中途转来的高二学生
player_goal: 补齐落下的功课，并弄清课桌里那封无名信是谁写的

core_rules:
  - 现实校园生活，无任何超自然元素
  - 叙事以书信、便条与日记的片段呈现：玩家习惯把日常写进给旧友的信里

style_guide:
  - 书信体：第一人称「我」写给收信人的口吻，段首偶有称呼，段末偶有落款
  - 克制、具体；不用华丽辞藻，少用感叹句

forbidden:
  - 修仙与法术
  - 魔法与超自然力量

opening: |
  我在晚自习的课桌抽屉里摸到一只没有署名的信封，牛皮纸，边角磨得起毛。

  信里只有三行字，末尾既没有称呼，也没有落款。我把它折好，塞进校服内袋。

  给老友的信我还没写完，这一封却先来了。

lore:
  - {id: wenxueshe, keys: [文学社], text: 文学社每周三放学后在旧图书室活动，负责校园广播的稿子；主编是高二(5)班的林夏。}
  - {id: yuekao, keys: [月考], text: 月考排名贴在走廊公告栏上；年级前二十名可以申请奖学金，也是下学期分班的依据。}
  - {id: jiutushuguan, keys: [旧图书室], text: 旧图书室在教学楼西头，钥匙在文学社手里，常年一股旧纸味。}
