- id: real_normal_02
  category: normal
  narration: '出校门往东，是一条不宽的老街。梧桐把路灯的光切成一格一格，铺在柏油上。


    放学的点在五点半到六点之间，人最多。穿校服的学生三五成群往前走，一半在说题，一半在说别的。有个男生边走边啃面包，包装纸攥在手里攥了一路；两个女生并排骑车，车筐里塞着卷子，角上翘出来，被风吹得噼啪响。


    天还没全黑。西边剩一条窄窄的橘色，往上很快变成灰蓝，最上头已经能看见一两颗星。


    走到邮局门口，我慢了下来。门口的绿邮筒漆掉了一块，投递口下面有一小片被摸亮的地方。


    有个人站在邮筒前，手里捏着一封信，信是折好塞进信封的，角对着投递口。他站了大概十几秒，指头在信封口上捏了捏，最后没投，把信塞回了外套口袋，转身往回走。走得不快，肩膀有一点垮。


    我没看清他的脸。


    从他身边过去的时候，我摸了摸自己内袋里的三样东西：两封信，一张方格纸。纸角隔着校服布料，硌着肋骨。


    前面不远就是我家那栋楼。天彻底暗下来，街对面的小饭馆开始飘味道出来。'
