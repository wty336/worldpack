- id: real_normal_01
  category: normal
  narration: '做到第二张卷子，自习室的门被推开一条缝，周牧探进半个身子，看见我，直接拐了过来，椅子腿在地上拖出一声。


    「你可真在这儿，」他把月考卷子往桌上一摊，指着一道函数题，「这问你怎么做的？我看你卷子上写得贼满。」


    我给他从头讲了一遍。他听得很认真，中间打断我两次，问「这步为啥能这么换」。讲完，他从笔袋里掏出两支笔，一支黑的一支红的，在卷面上改：黑的写步骤，红的圈自己漏掉的条件。


    「你字跟你说话真不一样。」我说。


    「啥意思。」


    「你写字一笔一划，收敛。」


    他愣了一下，把卷子往我这边推了推：「那是因为卷子要给老师看呗。我平时写字潦草得很，潦草到我自己都认不出。」


    他把卷子卷成筒塞进书包，站起来的时候又回头。


    「对了，」他挠了下后脑，「你最近老往这跑，是不是有事儿？你这两天话比以前还少。」


    外面天已经黑了，走廊的灯一盏一盏亮着。'
  expected: true
  day: 3
  scene: 城南中学·自习室
  present: []
  affections:
    lin_xia: 16.0
    zhou_mu: 11.0
    chen_laoshi: 11.0
  facts:
  - 玩家在晚自习抽屉里收到一封无署名牛皮纸信，只有三行字，提到「第三排靠窗的位置以前坐过一个也爱写信的人」，并指向周四下午的文学社旧图书室；玩家把信折好收进校服内袋，没给任何人看。
  - 林夏读过信后确认不是她的字；牛皮纸信封是文学社统一采购，领用要签字；门上「周四17:00 主编在」的值班卡是上周才贴的——写这封信的人知道社里的安排。
  - 早读前，玩家抽屉里出现第二张便条：「周三广播别听。」写在撕下来的方格稿纸上，字迹与第一封无名信出于同一人之手，收尾一笔写得急。
  - 玩家答题习惯把步骤一步步写全，宁可写慢也不跳步；月考后给自己定下的目标是冲进排名前列。
  - 月考成绩贴出当天，林夏把投稿箱底层一只牛皮纸信封交给玩家，上面只写「第三排靠窗」；玩家当着陈老师与林夏的面把无名信读了出来。
  - 玩家通过去自习室补课大成功，学力得到提升
