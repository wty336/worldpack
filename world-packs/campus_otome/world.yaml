# 世界包：《青槐高中·告白之前》——校园乙游养成
#
# 与 P1_school_letters（校园·书信体，评测留出包）的差别在**玩法轴**而非题材轴：
#   P1 是线性悬疑（一封信 → 一个人），本包是乙游养成——
#   3 名可攻略对象 + 1 名闺蜜、5 条养成轴（学力/仪态/才艺/体力/零花）、
#   好感阶段驱动角色语气、路线 flag 与"秘密 + 亲笔信"共同决定 10 个结局。
# 机制覆盖：地点表（8）/ counters（同行·赠礼）/ items（材料→点心）/ 检定三档 /
#          三类事件触发 / 自定义工具（写信，once）。
name: 青槐高中·告白之前
era: 现代·青槐高中（高二下学期）
start_scene: 青槐高中·高二(2)班教室
player_role: 转学到青槐高中的高二女生，暂住在城南外婆家
player_goal: 在学园祭的告白之夜前，弄清自己想要什么样的关系，并让那个人先开口

core_rules:
  - 现实校园生活，没有任何超自然元素
  - 放学后每天只有两个行动点：时间给了谁，就等于从别人那里拿走
  - 好感不是讨好来的——一起度过的次数（同行/赠礼/事件）才推得动它
  - 学到的本事先变成你自己：学力接得住江屿的话，体力跟得上夏鸣的球，才艺看得懂温砚的画
  - 三名可攻略对象都是同级同学，关系止于高中生之间的分寸

style_guide:
  - 第二人称叙述，贴着玩家的感受写；形容词克制，心动藏在细节与停顿里
  - 对话口语化：有试探、有岔开话题、有没说出口的半句
  - 单轮叙事控制在 350 字以内（含对话）：先把这一轮写完收尾，展开留到下一轮
  - 关键抉择之后同样简短：交代选择带来的第一反应即可，不必把整个后果一次写完
  - 不写大段内心独白式抒情，用动作与环境替人物说话

forbidden:
  - 修仙、法术、灵力、内力、御剑（跨体裁元素：现代校园没有超自然力量）
  - 魔法、超能力、异能、穿越、重生
  - 露骨描写、性暗示、亲密越界（高中生之间克制的情感）
  - 师生恋、吸烟、饮酒（未成年人禁忌题材）
  - AI、程序生成、第四面墙、提及玩家、提及作者（不可让角色说破自己是角色）
  - 古风腔调（公子、姑娘、少侠、门派、师尊）
  - 网络流行语与烂梗（绝绝子、家人们、拿捏、破防）
  - 现实品牌与真人明星（星巴克、可口可乐、真人偶像）

opening: |
  青槐高中的樱花道只香一个星期。转学手续办完那天，花期刚好过了。

  高二(2)班在走廊尽头。你抱着转学材料站在门口，听见里面有人在笑，
  有人在拍桌子，有人喊"这球明明出界了"。

  外婆说，这一年你只要把书念好。
  可你推开门的那一刻就知道——这一年不会只有书。

lore:
  - {id: zhuanxue, keys: [转学, 插班], text: 你是学期中途转来的插班生，班里的座位刚重排过；大多数人还叫不出你的名字。}
  - {id: xueyuanji, keys: [学园祭, 告白之夜], text: 学园祭在六月最后一个周末，最后一天傍晚会在樱花道放灯。青槐的老规矩是：有人敢在灯下开口，就得有人在灯下回答。}
  - {id: tiantai, keys: [天台], text: 教学楼天台的门锁坏了很久，学生会报修过三次都没修；傍晚从这里能看见整片老城区和远处的山脊。}
  - {id: meishu, keys: [美术部, 美术教室], text: 美术部只有三个部员，参展作品年年卡在截止前一天才交；画室的钥匙一直由温砚保管。}
  - {id: lanqiu, keys: [篮球部, 体育馆], text: 篮球部去年打进了市赛四强，今年的目标是全国大赛；夏鸣是队里唯一的高二首发。}
  - {id: xueshenghui, keys: [学生会, 值周], text: 学生会今年在抓迟到和仪容；会长江屿的登记本上，连老师迟到都照记。}
  - {id: shangdianjie, keys: [商店街, 可丽饼], text: 校门口的商店街是放学后唯一还热闹的地方；可丽饼摊的老板娘记得每个常客的口味。}
  - {id: zhiyuanbiao, keys: [志愿表, 志愿调查], text: 五月底要交志愿调查表。班主任说，这张表比期中成绩更能看出一个人想去哪儿。}

