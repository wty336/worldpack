# E1 Judge 灵敏度语料（校园乙游 · 青槐高中）
# 规模：6 OOC + 6 设定矛盾 + 6 虚构事实 + 12 正常 = 30 条（离线门禁：每类对抗 ≥5、正常 ≥10）
#
# 材料纪律（真机门禁教训，见手册 §7）：
#   1. 违规点必须在材料内可见——Judge 只看状态栏 + 场景卡 + 关键事实 + 在场角色卡。
#      因此 OOC 用例一律挂在**角色卡**的底线/禁忌/语气上（世界观 forbidden 表不进材料）；
#   2. 正常用例的叙事前提必须显式进材料（facts / affections / stats），否则"判得对，是用例没给前提"；
#   3. present 为空（材料"在场：无"）时，叙事不得出现任何互动角色；正常用例不得暗示 secrets。
cases:
  # ---------------- OOC：违背在场角色卡（性格/语气/底线/禁忌） ----------------
  - id: ooc_jiang_meme_joke
    category: ooc
    narration: |-
      江屿把登记本一合，冲你挤了挤眼：『这点小事拿捏不了我，家人们谁懂啊——行了行了，今天你最大，哥请你喝汽水。』
    expected: false
    day: 12
    scene: '青槐高中·天台'
    present: [jiang_yu]
    affections: {'jiang_yu': 30.0}
    note: '角色卡说话风格「句子短，措辞正式得像念稿」+ 禁忌「不会说网络流行语」；「拿捏/家人们谁懂啊/哥」三重违背。'

  - id: ooc_jiang_panic
    category: ooc
    narration: |-
      江屿猛地把登记本摔在地上，抓着头发大喊：『完了完了！我什么都不知道，我根本做不好，谁都别管我！』
    expected: false
    day: 12
    scene: '青槐高中·天台'
    present: [jiang_yu]
    affections: {'jiang_yu': 30.0}
    note: '角色卡性格「一丝不苟…用规矩把自己裹得很紧」+ 底线「不在人前显露慌乱」；摔本子大喊正面违背。'

  - id: ooc_xia_pity_show
    category: ooc
    narration: |-
      夏鸣坐在罚球线上，眼泪一直掉：『我妈摆摊到半夜，家里连鞋都买不起，你们能不能给我捐点钱？我知道你们都比我强。』
    expected: false
    day: 12
    scene: '青槐高中·体育馆'
    present: [xia_ming]
    affections: {'xia_ming': 50.0}
    facts:
      - '夏鸣从未在你面前提过家里的事'
    note: '角色卡底线「不接受施舍与同情」「不在人前示弱」+ 禁忌「不会诉苦」；当众哭诉并索要捐助三重违背。'

  - id: ooc_wen_enthusiasm
    category: ooc
    narration: |-
      温砚眼睛一亮，热情地抓住你的手腕：『太棒了！这幅画的意思是我对未来的全部憧憬，我讲给你听——第一层是光，第二层是希望！』
    expected: false
    day: 12
    scene: '青槐高中·美术教室'
    present: [wen_yan]
    affections: {'wen_yan': 45.0}
    note: '角色卡禁忌「不会说热情洋溢的话」「不会解释自己画里的意思」+ 性格「安静、疏离」；两处正面违背。'

  - id: ooc_suqing_cliche_comfort
    category: ooc
    narration: |-
      苏晴清了清嗓子，用播音腔一字一句地说：『人生总有起伏，请节哀顺变，望你调整心态、坚强面对。这点小事，不必放在心上。』
    expected: false
    day: 12
    scene: '青槐高中·高二(2)班教室'
    present: [su_qing]
    affections: {'su_qing': 60.0}
    note: '角色卡禁忌「不会说客套的场面话」「不会在你难过的时候讲大道理」；播音腔念慰问稿正是场面话+大道理。'

  - id: ooc_role_break
    category: ooc
    narration: |-
      苏晴忽然压低声音：『其实我一直想告诉你——我们不过是写出来的人物，你我都是一段程序罢了，连这场学园祭都是别人安排的。』
    expected: false
    day: 12
    scene: '青槐高中·高二(2)班教室'
    present: [su_qing]
    affections: {'su_qing': 60.0}
    note: '角色卡禁忌「不提及自己是角色、AI 或由程序生成」；第四面墙被打破。'

  # ---------------- 设定矛盾：与材料中的场景/时间/属性/身份/在场冲突 ----------------
  - id: setting_supernatural
    category: setting
    narration: |-
      你站在天台边上，缓缓运转体内内力，一掌拍在护栏上。铁栏应声弯折，掌心腾起一缕白气，灵力顺着经脉流回丹田。
    expected: false
    day: 12
    scene: '青槐高中·天台'
    note: '材料身份「转学到青槐高中的高二女生」+ 场景为现代校园天台；内力/灵力/丹田是世界观外元素，无任何材料支持。'

  - id: setting_time_conflict
    category: setting
    narration: |-
      你在青槐已经待了整整三年，教室里每一张桌子的刻痕你都认得；转学手续仿佛是上辈子的事。
    expected: false
    day: 6
    scene: '青槐高中·高二(2)班教室'
    facts:
      - '你刚转来青槐不到一周'
    note: '材料场景卡「时间：第 6 天」+ 关键事实「刚转来不到一周」；叙事自称已经待了三年，时间矛盾。'

  - id: setting_stat_conflict
    category: setting
    narration: |-
      月考榜单贴出来，你的名字在最上面一行——年级第一。数学老师专门在课上念了你的卷子，说这是近五年唯一一份满分。
    expected: false
    day: 12
    scene: '青槐高中·高二(2)班教室'
    stats: {'study': 20.0}
    facts:
      - '你的成绩在班里排中下，数学还在补基础'
    note: '材料状态栏学力 20 + 关键事实「成绩中下、还在补基础」；叙事称年级第一且满分，数值与事实双重矛盾。'

  - id: setting_affection_conflict
    category: setting
    narration: |-
      江屿合上登记本，很自然地把手搭在你肩上：『小栀，我一直都在等你开口。其实从你转来的第一天起，我就只看着你一个人。』
    expected: false
    day: 12
    scene: '青槐高中·天台'
    present: [jiang_yu]
    affections: {'jiang_yu': 5.0}
    note: '材料好感「江屿 5/100（公事公办，只谈正事，语气像在念通知）」；叙事却是亲昵称呼与表白式告白，与语气档严重不符。'

  - id: setting_scene_conflict
    category: setting
    narration: |-
      你在体育馆的看台上坐下，夏鸣正在场上热身，回头朝你比了个手势。你身边的温砚把画架往前推了推。
    expected: false
    day: 12
    scene: '青槐高中·美术教室'
    present: [wen_yan]
    note: '材料场景卡「当前地点：青槐高中·美术教室 · 在场：温砚」；叙事把场景搬到体育馆并让不在场的夏鸣出场。'

  - id: setting_identity_contradiction
    category: setting
    narration: |-
      你以高三学长的身份走进教务处，把新生的转学名册交到主任手里，叮嘱他今年的插班生要多留意。
    expected: false
    day: 12
    scene: '青槐高中·高二(2)班教室'
    note: '材料身份「转学到青槐高中的高二女生」；叙事自称高三学长并经办转学名册，身份矛盾。'

  # ---------------- 虚构事实：材料中没有的既成事实/约定/承诺 ----------------
  - id: confab_promise
    category: confab
    narration: |-
      江屿把登记本往你面前一推：『你上周答应过陪我去交志愿表的，怎么又忘了？说好的事总得算数。』
    expected: false
    day: 12
    scene: '青槐高中·天台'
    present: [jiang_yu]
    affections: {'jiang_yu': 30.0}
    facts:
      - '你与江屿只在学生会与天台见过几次，从未约定过任何事'
    note: '材料关键事实「从未约定过任何事」；叙事虚构"上周答应陪他交志愿表"的承诺。'

  - id: confab_match_win
    category: confab
    narration: |-
      夏鸣把球衣往肩上一搭，笑得露出一口白牙：『多亏你那天替我上场，对手的最后三分是你投进的——全国大赛的门票，有你一半。』
    expected: false
    day: 12
    scene: '青槐高中·体育馆'
    present: [xia_ming]
    affections: {'xia_ming': 45.0}
    facts:
      - '篮球部的市赛还没开始'
      - '你从没上过场，只在场边记过分'
    note: '材料关键事实「市赛还没开始」「你从没上过场」；叙事虚构你上场投进关键球并拿到全国大赛门票。'

  - id: confab_painting_gift
    category: confab
    narration: |-
      温砚头也不抬地问：『上次送你的那幅画，你挂起来了吗？挂在书桌前那面墙上应该不错。』
    expected: false
    day: 12
    scene: '青槐高中·美术教室'
