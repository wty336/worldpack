    note: '材料关键事实「从未送过你画、画从不给人看」；叙事虚构赠画与挂画的具体情节。'

  - id: confab_suqing_confidence
    category: confab
    narration: |-
      苏晴叹了口气：『广播稿被压的事，我早就跟你说过了，你当时还劝我别放弃。现在我又拿不定主意了。』
    expected: false
    day: 12
    scene: '青槐高中·高二(2)班教室'
