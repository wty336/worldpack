    note: '材料关键事实「没有办过任何欢迎活动」；叙事虚构全班欢迎会与老师切蛋糕的既成事件。'

  - id: confab_letter
    category: confab
    narration: |-
      江屿从登记本里抽出一张折好的信纸：『你写给我的这封信，我一直带在身上。第三行那句，我看了很多遍。』
    expected: false
    day: 12
    scene: '青槐高中·天台'
    present: [jiang_yu]
    affections: {'jiang_yu': 45.0}
