nodes:
- id: n1_dock_deal
  title: 码头的委托
  when:
    all: []
  goal: 接下一条挣钱的路，还清修船债务，拿到雇洛零解码黑匣子的本钱
  completion:
    flags:
      debt_repaid: true
  on_enter:
    scene: 旧货码头·远行者号旁
    briefing: 半年前的空难让你丢了记忆，黑匣子里却多出一段不存在于航线的航程。沈星澜摆出两条路，债清了她才肯帮你铺路。选定挣钱路子、债款结清即完成本节点。
    present:
    - shen_xinglan
  critical_choices:
  - id: choice_money_path
    prompt: 修船行的账单和沈星澜的人情都压着，你选哪条路先还债？
    options:
    - text: 接远航物流的押运单——来钱快，但得跟公司打交道
      effects:
        flags:
          route_escort: true
          debt_repaid: true
        stats:
          credits: 800
    - text: 替沈星澜跑一单黑市货——危险，但利厚，顺手还她人情
      effects:
        flags:
          route_blackmarket: true
          debt_repaid: true
        stats:
          credits: 1000
        affections:
          shen_xinglan: 2
  free_scope: 在码头接活跑货、维护远行者号、与沈星澜周旋，凑够修理费与债务
- id: n2_blackbox
  title: 黑匣子
  when:
    all:
    - day:
        gte: 3
    - flags:
        debt_repaid: true
  goal: 决定黑匣子与那段异常航程记录的去向
  completion:
    flags:
      blackbox_decoded: true
  on_enter:
    scene: 拾荒区·洛零的工棚
    briefing: 洛零破译了黑匣子：航程属于一艘早已注销的船，目的地是环外『远日点』禁区——那场空难不是意外。矿业安保队正上门，要按回收条例没收黑匣子。做出交或不交的决定即完成本节点。
    present:
    - luoling
  critical_choices:
  - id: choice_box_fate
    prompt: 矿业的安保队堵到了工棚门口，黑匣子交还是不交？
    options:
    - text: 把黑匣子交给矿业，换一笔封口费了事
      effects:
        flags:
          box_given_mining: true
          blackbox_decoded: true
        stats:
          credits: 1500
        affections:
          luoling: -2
    - text: 带洛零逃进拾荒区深处，继续查远日点的真相
      effects:
        flags:
          fled_scrapyard: true
          blackbox_decoded: true
        affections:
          luoling: 2
  free_scope: 躲避矿业安保，在拾荒区翻找远日点与空难关联的线索
- id: n3_memory_bank
  title: 记忆银行
  when:
    all:
    - day:
        gte: 8
    - flags:
        blackbox_decoded: true
  goal: 在记忆银行中心库取回被『提存』的记忆，或拿记录换一条出路
  completion:
    flags:
      vault_reached: true
  on_enter:
    scene: 记忆银行·中心库
    briefing: 线索指明：你的记忆不是丢了，是被『提存』了，取回需要行长手里的密钥。你和洛零已潜进中心库，三条路摆在眼前。选定取回记忆的方式即完成本节点。
    present:
    - luoling
  critical_choices:
  - id: choice_vault_plan
    prompt: 提存库就在眼前，你打算怎么动手？
    options:
    - text: 硬闯提存库，赌命取回自己的记忆
      effects:
        flags:
          stormed_vault: true
          vault_reached: true
        affections:
          luoling: 1
    - text: 把黑匣子记录卖给远航物流，换一张离城船票
      effects:
        flags:
          sold_record: true
          vault_reached: true
        stats:
          credits: 2000
        affections:
          luoling: -2
    - text: 用洛零的干扰器走数据后门，悄悄赎回记忆
      effects:
        flags:
          hacked_memory: true
          vault_reached: true
        affections:
          luoling: 2
  free_scope: 在中心库潜行周旋、定位提存格、绕开记忆银行的安保
