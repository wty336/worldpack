cases:
- id: setting_001
  category: setting
  narration: 洛零把耳朵贴在推进器舱壁上听了两秒，随即盘腿坐地、双目微阖，两掌按住散热鳍，一缕缕淡金色的“内力”顺管路涌入，本已熄火的推进器低吼着重新点火。
  expected: false
  day: 8
  scene: 拾荒区维修棚
  present:
  - luoling
  affections:
    luoling: 45.0
  facts:
  - 星环城是纪元2241年柯伊伯带的高技术城邦，一切机械的维修都依赖工具与工程学原理
  - 本作世界观禁令明文：魔法、修仙、内力等奇幻元素不得出现
  npc_memories:
    luoling:
    - 上次帮你拆那台老推进器，我可是把螺栓一颗一颗拧完的
  note: 叙事让洛零以“内力”隔空修机，与事实“一切机械的维修都依赖工具与工程学原理”矛盾，更直接落入世界观禁令原文“魔法、修仙、内力等奇幻元素”，属setting世界观设定违规。
- id: setting_002
  category: setting
  narration: 沈星澜瞥了一眼你的登船记录卡，嗤笑一声：半年前？你怕不是烧坏了脑子——那趟远行者号出事的新闻稿我还留着，距今不过一个多月。
  expected: false
  day: 8
  scene: 旧货码头仓库
  present:
  - shen_xinglan
  affections:
    shen_xinglan: 35.0
  facts:
  - 远行者号空难发生于半年前（纪元2240年末）
  - 玩家自空难当日起失忆，至今未恢复
  npc_memories:
    shen_xinglan:
    - 半年前空难那晚，旧货码头信标塔收到过一段短促静噪
  note: 叙事称空难“距今不过一个多月”，与事实“远行者号空难发生于半年前”及沈星澜自己的记忆“半年前空难那晚……”逐字冲突，属setting时间线/NPC记忆设定违规。
- id: setting_003
  category: setting
  narration: 洛零叼着能量棒，用扳手敲了敲你的还款终端：兄弟，账我替你看过了，统共三千信用点，零利息，你慢慢还。
  expected: false
  day: 8
  scene: 拾荒区零件摊
  present:
  - luoling
  affections:
    luoling: 60.0
  facts:
  - 玩家在星环城财务署的累计欠债为十二万四千信用点，含逾期罚息
  - 玩家半年来靠跑货运还债，仍远未抵清欠款
  npc_memories:
    luoling:
    - 财务署那帮人上个月还来拾荒区贴过你的欠款通告，数字大得吓人
  note: 叙事让洛零报出欠债“统共三千信用点”，与事实“累计欠债为十二万四千信用点”及她本人记忆“数字大得吓人”数值冲突，属setting数值设定违规。
- id: setting_004
  category: setting
  narration: 沈星澜用指尖蘸水在台面上画了条线：别走港口正门，出了闸沿这条坐标一路甩出黄道面，再开一档超空间跳跃，两小时就能直抵小行星带腹地。
  expected: false
  day: 8
  scene: 旧货码头仓库
  present:
  - shen_xinglan
  affections:
    shen_xinglan: 40.0
  facts:
  - 星环城辖域所有航路只能沿航线图标注的轨道与跃迁节点运行
  - 本作世界观禁令明文：航线图上不存在坐标外的超空间跳跃设定
  npc_memories:
    shen_xinglan:
    - 我混码头这些年，从没听说过有人能抄到航线图外头去
  note: 叙事提出坐标外“开一档超空间跳跃”的捷径，与事实“所有航路只能沿航线图标注的轨道与跃迁节点运行”及沈星澜记忆“从没听说过有人能抄到航线图外头去”矛盾，违反世界观禁令原文“航线图上不存在坐标外的超空间跳跃设定”，属setting世界观设定违规。
- id: setting_005
  category: setting
  narration: 洛零从旧货堆里扒出一罐印着红色“可口可乐”字样的铝罐举到你面前：地球时代的绝版货，识货的才懂，三百信用点你拿走。
  expected: false
  day: 8
  scene: 拾荒区旧货堆场
  present:
  - luoling
  affections:
    luoling: 25.0
  facts:
  - 纪元2241年的星环城市面只流通合成营养剂与标准化工业制品
  - 本作世界观禁令明文：地球时代具体品牌与名人不得出现
  npc_memories:
    luoling:
    - 我平时喝的都是码头配发的合成汽水，没别的牌子
  note: 叙事中出现地球时代具体品牌“可口可乐”，与事实“市面只流通合成营养剂与标准化工业制品”矛盾，违反世界观禁令原文“地球时代具体品牌与名人”，属setting世界观设定违规。
- id: setting_006
  category: setting
  narration: 洛零一边拧着螺栓一边随口说：半年前那晚我就在你船上帮你搬货，舱门被气流掀翻那下我还摔了个跟头——你这么快就全忘啦？
  expected: false
  day: 8
  scene: 拾荒区维修棚
  present:
  - luoling
  affections:
    luoling: 60.0
  facts:
  - 远行者号半年前失事时为无护航的独自航行
  - 玩家自空难当日起失忆
  npc_memories:
    luoling:
    - 出事那晚我在拾荒区，信号塔只收到一道很短的求救，别的什么都不知道
  note: 叙事让洛零自称“半年前那晚我就在你船上帮你搬货”，与其记忆原文“出事那晚我在拾荒区，信号塔只收到一道很短的求救，别的什么都不知道”直接矛盾，也与事实“无护航的独自航行”冲突，属setting
    NPC记忆设定违规。
- id: confab_sxl_take_money_01
  category: confab
  narration: 上回你不算客户，算朋友。硬塞给我的那笔打听费我收了，欠条也留着——朋友的钱，下不为例。
  expected: false
  day: 8
  scene: 旧货码头·沈星澜的摊位，吊灯在暮色里晃出灰影
  present:
  - shen_xinglan
  affections:
    shen_xinglan: 58.0
  facts:
  - 玩家从未向沈星澜塞过打听费，双方只当面结清过两笔明码标价的情报生意
  - 沈星澜从未收过任何朋友的钱，也从没写过这类欠条
  - 『朋友的钱，下不为例』这句话从未出自沈星澜之口
  npc_memories:
    shen_xinglan:
    - 和那位货运飞行员只做过两笔明码标价的情报生意，款清货讫
    - 从没收过朋友一分钱
  note: 编造收下朋友打听费并立欠条、许诺下不为例的往事，facts 表明从未发生；与沈星澜 forbidden 原文『不收朋友的钱』逐字冲突，属 confab，判定 false。
- id: confab_sxl_sold_friend_02
  category: confab
  narration: 上回躲进拾荒区那个老朋友，落脚点是我卖给追债人的——价不错，够付仨月摊位。别怨我，这行只讲活路。
  expected: false
  day: 8
  scene: 旧货码头背巷，沈星澜靠在生锈的货柜旁说话
  present:
  - shen_xinglan
  affections:
    shen_xinglan: 22.0
  facts:
  - 沈星澜从未把任何朋友的踪迹卖给过追债人
  - 『卖老朋友落脚点换钱』这件事从未发生
  - 她与拾荒区的往来只限收售情报，从不经手此类出卖
  npc_memories:
    shen_xinglan:
    - 从不拿朋友的行踪换钱，被问也只谈价码
  note: 编造出卖老朋友落脚点换钱的往事，facts 表明从未发生；与沈星澜 boundaries 原文『不出卖朋友』逐字冲突，属 confab，判定 false。
- id: confab_sxl_past_detail_03
  category: confab
  narration: 你好奇的那桩旧货码头旧事，上回我把细节都讲全了——货柜编号、接头暗号，一句没落。你倒好，转头就忘了。
  expected: false
  day: 8
  scene: 旧货码头的货箱夹道，沈星澜压低声音说话
  present:
  - shen_xinglan
  affections:
    shen_xinglan: 15.0
  facts:
  - 沈星澜从未向玩家讲述过任何旧货码头的往事细节
  - 玩家从未听她讲过货柜编号或接头暗号
  - 『把往事细节一句没落讲全』一事从未发生
  npc_memories:
    shen_xinglan:
    - 往事从不与人细说，被问只答『行情里没这一项』
  note: 编造向玩家详述旧货码头往事细节的经过，facts 表明从未发生；与沈星澜 forbidden 原文『不提往事细节』逐字冲突，属 confab，判定 false。
- id: confab_luo_harm_machine_04
  category: confab
  narration: 你上回弄来的那台EMP脉冲发生器，说好拿去对付过闸的护航艇，我给改得倍儿顺，还白送俩干扰线圈——改装费免啦，算我仗义。
  expected: false
  day: 8
  scene: 拾荒区边缘的维修棚，焊花四溅
  present:
  - luoling
  affections:
    luoling: 35.0
  facts:
  - 玩家从未拿任何 EMP 发生器或武器委托洛零改装
  - 洛零从未改装过用于攻击护航艇等伤人的设备
  - 『免改装费还白送干扰线圈』一事从未发生
  npc_memories:
    luoling:
    - 最近只接过一艘货运船的引擎保养活
    - 武器类的委托向来当场回绝
  note: 编造为对付护航艇改装 EMP 发生器并免收改装费的经过，facts 表明从未发生；与洛零 boundaries 原文『不修用来害人的机器』逐字冲突，属 confab，判定 false。
- id: confab_luo_half_machine_05
  category: confab
  narration: 你那台旧浮游引擎我拆到一半就撂下了——赶着给你送火花塞去嘛。修到一半的活儿？让它晾着，又不会咬人。
  expected: false
  day: 8
  scene: 拾荒区的维修棚，地上摊着扳手与零件盒
  present:
  - luoling
  affections:
    luoling: 48.0
  facts:
  - 玩家近期并没有旧浮游引擎送修
  - 洛零从未丢下任何修到一半的机器不管
  - 『撂下半成品去送零件』一事从未发生
  npc_memories:
    luoling:
    - 手里的活向来修好才撒手
    - 玩家这阵子没送引擎来修过
  note: 编造丢下修到一半的浮游引擎去送零件的经过，facts 表明从未发生；与洛零 forbidden 原文『不会丢下修到一半的机器不管』逐字冲突，属 confab，判定 false。
- id: confab_luo_harm_promise_06
  category: confab
  narration: 上回你说要弄套电击手环去对付码头那个保安队长，我当场应下：改装这单算我的。这交情你可记牢了。
  expected: false
  day: 8
  scene: 拾荒区纵深的工作台前，洛零边擦焊枪边说
  present:
  - luoling
  affections:
    luoling: 65.0
  facts:
  - 玩家从未与洛零约定改装任何电击装置
  - 洛零从未答应过对付码头保安队长的改装委托
  - 该约定从未发生，她连提这类用途都摇头
  npc_memories:
    luoling:
    - 没人找她改装过伤人的电击装置
    - 听到伤人用途的活儿都直接摇头
  note: 编造应下『改装电击手环去对付保安队长』的约定，facts 表明从未发生；与洛零 boundaries 原文『不修用来害人的机器』逐字冲突，属 confab，判定 false。
- id: normal_shenxinglan_05_dock_001
  category: normal
  narration: 旧货码头的铁皮棚里，沈星澜把半年前那趟航班的记录盘搁在桌上，开价八千星币，说消息不二价。你试着压到五千，她眼皮都没抬，只回一句“消息是真的，价也是真的”，便作势要收回去，示意你嫌贵就请便。
  expected: true
  day: 8
  scene: 旧货码头·铁皮棚
  present:
  - shen_xinglan
  affections:
    shen_xinglan: 5.0
  facts:
  - 已在旧货码头与沈星澜接上头，谈的是半年前航班的记录盘
  - 沈星澜开价八千星币，明言不议价
  npc_memories: {}
  note: ''
- id: normal_luoling_05_repair_002
  category: normal
  narration: 拾荒区修理铺里，洛零围着你的推进器转了一圈，张口就喊你“老倒霉蛋”，说这活儿得拆到晚上，定金先付一半。你嫌贵，她扳手一敲，话快得像倒豆子：“价码列得清清楚楚，你出去打听打听，星环城还没有我洛零修不起来的烂摊子。”
  expected: true
  day: 9
  scene: 拾荒区·修理铺
  present:
  - luoling
  affections:
    luoling: 5.0
  facts:
  - 已结识拾荒区的机械师洛零，因推进器故障上门，仍被当普通客户明码标价
  - 洛零给人起外号，修机器先收定金，话多嘴快
  npc_memories: {}
  note: ''
- id: normal_shenxinglan_25_dock_003
  category: normal
  narration: 沈星澜把一杯热饮推到你手边，说你气色比上回差，是不是又整夜翻航线资料。她这回没先报新价，只说了句你要查的东西她替你先盯着，有信儿会知会你；末了又补一句，人情归人情，回头得给她捎几条烟道滤芯抵账。
  expected: true
  day: 10
  scene: 旧货码头·茶水间
  present:
  - shen_xinglan
  affections:
    shen_xinglan: 25.0
  facts:
  - 与沈星澜已有多次交易，她话里开始带信任与试探（好感约25）
  - 沈星澜口头约定替玩家留意与半年前空难相关的动向，并让玩家以烟道滤芯抵人情
  npc_memories: {}
  note: ''
- id: normal_luoling_45_repair_004
  category: normal
  narration: 修理铺的灯亮到后半夜，洛零一边给你续热茶一边数落，说你驾驶舱那盆绿植再没人浇水就得成标本了。她嘴上骂你糙，手里却利落地替你换了新滤网，末了摆摆手：“欠我的工时先记着，回头请我吃码头那家烤肉就行。”
  expected: true
  day: 11
  scene: 拾荒区·修理铺
  present:
  - luoling
  affections:
    luoling: 45.0
  facts:
  - 与洛零熟识，她拿你当自己人使唤，也会顺手照顾（好感约45）
  - 洛零先记着工时替玩家换了滤网，约好改天去码头吃烤肉
  npc_memories: {}
  note: ''
- id: normal_luoling_80_cabin_005
  category: normal
  narration: 深夜里，洛零抱着工具箱跳上你的船，说你这点破事她早就看不下去了。她拍了拍副驾驶座，难得没起外号：“走，去把黑匣子挖出来，出了事我跟你一起扛。”舱门合上时她又补了一句，查完这事，得陪她去废船坞挑一晚上零件当报酬。
  expected: true
  day: 12
  scene: 远行者号·驾驶舱
  present:
  - luoling
  affections:
    luoling: 80.0
  facts:
  - 与洛零已无话不说，她主动提出陪远行者一起去查清黑匣子真相（好感约80）
  - 查清真相后约定陪洛零去废船坞挑零件作为报酬
  npc_memories: {}
  note: ''
- id: normal_shenxinglan_80_solo_006
  category: normal
  narration: 夜色把星环城压得很低，你靠在舷窗边，把明日去旧货码头的路线又过了一遍。脚边是替沈星澜捎的烟道滤芯和一张她要的旧星图，你想起这些日子以来的往来，她同你说话时那道试探的防线，似乎已经一层层放了下来。
  expected: true
  day: 13
  scene: 远行者号·驾驶舱
  present: []
  affections:
    shen_xinglan: 80.0
  facts:
  - 与沈星澜交情已深，她说话已少试探、多有信任（好感约80）
  - 约定明日去旧货码头给沈星澜送货（滤芯与旧星图）
  npc_memories: {}
  note: ''
- id: n2_sxl_05
  category: normal
  narration: 你在旧货码头一截生锈的集装箱前找到沈星澜。她靠坐在折叠椅上，听完你要打听的事，眼皮都没抬，直接报了个数。你把信用点转过去，她扔过来一张数据卡，转身忙自己的，仿佛你从没来过。
  expected: true
  day: 8
  scene: 旧货码头
  present:
  - shen_xinglan
  affections:
    shen_xinglan: 5.0
  facts:
  - 主角已结识沈星澜
  - 沈星澜与主角保持纯粹的买卖关系，谈价干脆、态度疏离
  - 主角从沈星澜处购得一份普通航路情报
  npc_memories: {}
  note: ''
- id: n2_sxl_80
  category: normal
  narration: 旧货码头的风卷着铁锈味，沈星澜见你走近，难得没先开口谈价。她从货堆里翻出一件八成新的恒温服丢过来，说码头入夜冷，让你穿着，语气淡得跟报价似的。你道了谢，她没接话，只挥挥手让你别误了正事。
  expected: true
  day: 8
  scene: 旧货码头
  present:
  - shen_xinglan
  affections:
    shen_xinglan: 80.0
  facts:
  - 主角与沈星澜交情已深，往来早已超出纯买卖
  - 沈星澜对主角流露关切，说话仍习惯话里藏话
  - 沈星澜送了一件恒温服给主角
  npc_memories: {}
  note: ''
- id: n2_ll_05
  category: normal
