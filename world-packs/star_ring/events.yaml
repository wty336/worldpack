events:
- id: ev_wake_debt
  title: 码头的两条路
  trigger:
    kind: time
    when:
      day:
        gte: 1
  priority: normal
  script: 在旧货码头醒来，欠着修理费和沈星澜的人情债，她递来押运与黑市两条路。
  effects:
    affections:
      shen_xinglan: 5
  once: true
- id: ev_luo_blackbox
  title: 黑匣子的秘密
  trigger:
    kind: time
    when:
      day:
        gte: 3
  priority: normal
  script: 洛零破译黑匣子，航程记录属于一艘已注销的船，目的地是环外的远日点禁区。
  effects:
    affections:
      luoling: 5
  once: true
- id: ev_shen_hint
  title: 她知道的比你多
  trigger:
    kind: condition
    when:
      all:
      - affection:
          shen_xinglan:
            gte: 30
  priority: normal
  script: 沈星澜暗示：你的记忆不是丢了，是被记忆银行提存了，取回需要行长的密钥。
  effects:
    affections:
      shen_xinglan: 5
  once: true
- id: ev_luo_signal
  title: 机器的耳朵
  trigger:
    kind: schedule
    action: gift_luoling
    chance: 0.3
  priority: normal
  script: 送洛零零件，她兴奋地说黑匣子信号里藏着矿业的登记编号。
  effects:
    affections:
      luoling: 5
  once: true
