endings:
- id: ending_xinghuan_return
  title: 星环归人
  kind: auto
  when:
    all:
    - flags:
        box_given_mining: true
    - affection:
        shen_xinglan:
          gte: 40
  text: 你把黑匣子交给矿业，把那段过去永远存进了记忆银行。有些过去不重要，星环城里有些人在等你留下。
- id: ending_far_traveler
  title: 远行之人
  kind: auto
  when:
    all:
    - flags:
        hacked_memory: true
  text: 你从数据后门悄悄赎回记忆，驾远行者号穿过航务塔，向航线图上不存在的坐标飞去。星环城的灯火沉入身后永夜。
- id: ending_free_spirit
  title: 自由之身
  kind: auto
  when:
    all:
    - flags:
        sold_record: true
  text: 黑匣子换了一张离城船票和一大笔信用点。你带上洛零远走高飞，拿过去换自由，不亏。
- id: ending_trapped_beast
  title: 星环困兽
  kind: auto
  when:
    all:
    - flags:
        trapped_day12: true
  text: 第12天你仍没能查出真相。记忆银行的人先一步找上门，你被永远留在了星环城。
