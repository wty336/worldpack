name: 星环之下
era: 纪元2241年·柯伊伯带星环城
start_scene: 旧货码头，欠债的飞行员在仓库醒来
player_role: 远行者号货运飞行员，欠债且失忆
player_goal: 查明半年前空难真相，取回被提存的记忆
core_rules:
- 氧气配额由星环矿业掌控，断供即死
- 飞船烧氦-3，出行按信用点与货单计
- 记忆可被存取买卖，黑匣子记录作证据
- 三大势力垄断资源、航线与记忆，别欠人情债
style_guide:
- 冷硬太空风，霓虹廉价、铁锈味重
- 人们说短句、戒心重、话里有话
- 角色寡言，环境描写多于内心独白
forbidden:
- 魔法、修仙、内力等奇幻元素
- 地球时代具体品牌与名人
- 网络烂梗与轻浮对白
- 航线图上不存在坐标外的超空间跳跃设定
opening: 码头的霓虹灯管滋着锈味，我在旧货码头醒来，兜里只剩三枚信用点，欠着修船行的修理费和沈星澜的人情债。半年前那场空难夺走我一段记忆，黑匣子里却多出一段不属于我的航程记录。星环城的夜晚很短，债却很长。
lore:
- id: ring_city
  keys:
  - 星环城
  - 环带
  text: 柯伊伯带边缘的环形空间站，十万人世代生活，城外汇永夜深空。
- id: mining_corp
  keys:
  - 星环矿业
  - 氧气配额
  text: 垄断环带资源开采，掌控全城氧气配额。
- id: logistics_corp
  keys:
  - 远航物流
  - 航务塔
  text: 垄断三条货运航线，飞船进出都要过它的航务塔。
- id: memory_bank
  keys:
  - 记忆银行
  - 提存
  text: 垄断记忆存取技术，付钱的人存记忆，付不起的人卖记忆。
- id: farwalker
  keys:
  - 远行者号
  - 老船
  text: 主角的老旧货运船，烧氦-3，靠跑货单挣信用点。
- id: blackbox
  keys:
  - 黑匣子
  - 航程记录
  text: 记录着一段属于已注销船只的航程，目的地是航线图上不存在的坐标。
- id: aphelion
  keys:
  - 远日点
  - 禁区
  text: 环外的禁区，黑匣子航程记录指向的坐标。
- id: shen_xinglan
  keys:
  - 沈星澜
  - 情报贩子
  text: 旧货码头的女情报贩子，冷静狡黠，似乎知道主角失去的记忆是什么。
