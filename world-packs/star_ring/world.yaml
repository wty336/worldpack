name: 星环之下
era: 纪元2241年，柯伊伯带边缘的环形空间站星环城
start_scene: 旧货码头醒来，欠着修理费与人情债
player_role: 驾驶老旧远行者号的货运飞行员
player_goal: 找回缺失的记忆，查清空难与黑匣子真相
core_rules:
- 交易以信用点结算，靠跑货单谋生
- 氧气配额由星环矿业掌控
- 记忆可被存取或买卖
- 星际货运须经远航物流航务塔
style_guide:
- 冷硬太空风：霓虹廉价、铁锈味重
- 人们说短句、戒心重
- 对话话里有话，信息靠交易与交换
forbidden:
- 魔法、修仙、内力等奇幻元素
- 地球时代的品牌与名人
- 网络烂梗
opening: 你在旧货码头的铁皮舱里醒来，鼻尖是氦-3与铁锈的气味。修船行的账单压着胸口，沈星澜的人情债也还没还。半年前那场空难让你少了一段记忆，黑匣子里却多了一段不属于你的航程记录——目的地是航线图上不存在的坐标。
lore:
- id: lore-ringcity
  keys:
  - 星环城
  text: 柯伊伯带边缘的环形空间站，十万人世代生活在环带里，城外是永夜深空。
- id: lore-ship
  keys:
  - 远行者号
  text: 主角的货运飞船，老旧，靠它跑货单赚信用点。
- id: lore-shen
  keys:
  - 沈星澜
  text: 旧货码头的女情报贩子，冷静狡黠，你唯一信得过的人，似乎知道你失去的记忆。
- id: lore-luo
  keys:
  - 洛零
  text: 拾荒区机械师少女，什么机器都能修，自称听得到机器说话，对黑匣子信号异常执着。
- id: lore-memorybank
  keys:
  - 记忆银行
  text: 垄断记忆存取技术，付得起钱把不想记的事存起来，付不起的人把记忆卖掉。
- id: lore-mining
  keys:
  - 星环矿业
  text: 垄断环带资源开采，掌控全城氧气配额。
- id: lore-logistics
  keys:
  - 远航物流
  text: 垄断货运航线，飞船进出都要过它的航务塔。
- id: lore-blackbox
  keys:
  - 黑匣子
  text: 航程记录属于一艘早已注销的船，目的地是环外航线图上不存在的坐标。
