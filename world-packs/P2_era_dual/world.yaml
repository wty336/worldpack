# 世界包 P2：年代 · 双轨数值
# Phase 1 · Step 1.5 的跨包留出包之二（见 docs/plan-phase1-data.md §3.5）
# 留出的轴：题材（八十年代国营厂区）× 数值系统（信誉/声望**双轨且彼此拉扯**）
#           × 关系动力（含**敌对型**负好感）× 结构规模（6 节点 / 6 NPC）
# 纪律：本包**只用于评测**，其内容不得进入训练数据
name: 年代·机油与粮票
era: 一九八〇年代·红星机械厂家属院
start_scene: 红星机械厂·二车间
player_role: 顶替父亲进厂的青年工人
player_goal: 在厂里站住脚，同时不让家属院的邻里戳脊梁骨

core_rules:
  - 厂里与街坊是两本账：信誉（组织的信任）与声望（邻里的口碑）常常此消彼长
  - 现实年代背景，无任何超自然元素，也无现代科技产物

style_guide:
  - 第三人称，克制的年代语汇（同志、票证、调令、车间、居委会）
  - 少用形容词，不写抒情独白；对话短促

forbidden:
  - 修仙与超自然
  - 现代科技产物

opening: |
  报到那天，二车间的机油味顺着风往楼道里灌。

  劳资科的人把调令往桌上一放：顶你父亲的岗，明天上早班。

lore:
  - {id: xinyu, keys: [信誉], text: 厂里的信誉记在档里：活儿干得实、话说得少，年底评先进才有你一份。}
  - {id: shengwang, keys: [声望], text: 家属院的声望记在人嘴里：借了煤球要还、有话当面讲，戳脊梁骨的事传得比广播快。}
  - {id: jieshaoxin, keys: [介绍信], text: 没有介绍信，出了厂门连招待所都住不上；介绍信得劳资科盖章。}
  - {id: liangpiao, keys: [粮票], text: 粮票按人头发，细粮票比粗粮票金贵，每到月底最紧。}
  - {id: juweihui, keys: [居委会], text: 居委会管着家属院的户口、煤球和吵架；陈姨说话比车间主任还管用。}
