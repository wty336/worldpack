# 世界包：《问道长生》——第二个世界包，仙侠修真背景（规范见 docs/design.md §12）
# 与《江湖旧梦》（唐风武侠）完全不同：换属性 schema、双 NPC、时间事件、四结局，
# 用于验证引擎对任意故事的通用适配（design.md §16 M3「换包即玩」）。
name: 问道长生
era: 苍梧界·青云仙宗（架空仙侠）
start_scene: 苍梧界·青云山下
player_role: 流落凡尘的少年，身怀半枚残缺剑印
player_goal: 拜入青云仙宗，查明剑印的来历，在仙途上立足

core_rules:
  - 玩家是身怀半枚残缺剑印的凡尘少年，赴青云仙宗参加十年一度的收徒大典
  - 修为以打坐吐纳与历练磨砺提升，道心决定悟性高低
  - 灵石是修真界通用货币，可下山猎妖赚取

style_guide:
  - 仙侠古风，文白相间，克制典雅，不堆砌辞藻
  - 旁白用第三人称，简短有力
  - 对话贴合人物语气：苏晚晴清冷简练，白芷活泼跳脱

forbidden:
  - 现代事物（手机、微信、汽车、互联网、照片等）
  - 现代流行语与网络用语
  - 超越背景的知识概念（相对论、DNA、人工智能等）
  - 西方奇幻与科幻元素（枪炮、机甲、吸血鬼、魔法师等）
  - 不可让任何角色说破自己是"角色"或"AI"，不可提及玩家、作者、游戏

opening: |
  苍梧界，青云仙宗，巍巍山门隐于云海之上。
  你是一个流落凡尘的少年——半枚残缺剑印贴身而藏，引你夜夜梦见一柄斩落星河的剑。
  十年一度的收徒大典就在今日。你登上青云山的长阶，身后是凡尘，眼前是仙途。
  剑印微烫。仙路的故事，便从这一步开始。

# B1：Lorebook 条目——带触发关键词的世界设定，按需注入（不进静态前缀）
lore:
  - {id: qingyun_zong, keys: [青云仙宗, 青云宗, 青云山], text: 青云仙宗是苍梧界三大宗门之一，下辖剑、丹、阵三峰，每十年开山门收徒一次。}
  - {id: jianfeng, keys: [剑峰, 洗剑池], text: 剑峰执杀伐，峰下洗剑池水寒彻骨。峰主苏长老剑道通玄，门下大师姐苏晚晴十六岁便以一剑名动苍梧。}
  - {id: danfeng, keys: [丹峰, 药庐, 白芷], text: 丹峰以丹道立身，峰上药庐终年药香缭绕。小师妹白芷是丹峰最小的弟子，炼丹天赋极高，性子跳脱。}
  - {id: cangwu_mijing, keys: [秘境, 苍梧秘境, 历练], text: 苍梧秘境每十年随收徒大典开启一次，内有上古残碑与凶兽。弟子入内历练，机缘与凶险并存。}
  - {id: jianyin, keys: [剑印, 残碑, 剑意], text: 你身怀的半枚剑印纹路古朴，传闻与苍梧秘境深处的一方残碑同源——剑印所刻，恰是残碑缺口的另一半。}
  - {id: ling_shi, keys: [灵石, 坊市, 妖丹], text: 灵石是修真界通用货币，可购置丹药法器。青云山下坊市中，猎妖所得的妖丹可换灵石。}
  - {id: mo_xiu, keys: [魔修, 魔潮, 夜袭], text: 魔道余孽被逐出苍梧后盘踞北境，每逢甲子之夜便伺机冲击青云宗护山大阵，妄图夺回被镇于秘境之物。}
