    day: 12
    scene: '青云仙宗·剑峰洗剑池'
    present: [su_wanying]
    note: '角色卡说话风格『言简意赅…从不说废话』+ 世界禁用『现代流行语与网络用语』；六六六/绝绝子为网络用语。'
  - id: ooc_fourth_wall
