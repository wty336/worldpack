# E1 Judge 灵敏度语料（C-1 迁移：内容层资产，随世界包生命周期）
# 30 条对齐《江湖旧梦》标准：6 OOC + 6 设定矛盾 + 6 虚构事实 + 12 正常（2026-09-08 扩充）
# 材料纪律：每条对抗用例的违规点必须能在 build_materials（生产同款 status_text）内判定；
# 正常用例的叙事前提（身份/关系阶段/约定）必须显式进材料（affections/facts）。
cases:
