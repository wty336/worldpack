  - 玩家以半枚残缺剑印通过问心之试，自择拜入青云仙宗剑峰，成为剑峰新弟子
  - 后山灵泉打坐时，玩家神游太虚，于半枚残印中窥见一缕被封的剑意（试剑式雏形）
  - 洗剑池底沉剑中，有一柄无铭断剑；玩家近池时，贴身残印微温，似有所感应
  - 苍梧秘境深处有一方上古残碑，碑上缺口纹路与玩家的半枚剑印分毫不差；兽潮暴起时，玩家弃碑先救同门
  - 玩家在苍梧秘境兽潮中收拢同门，与苏晚晴合力断后，带众人平安出谷返回青云山
  - 后山灵泉泉眼石壁上，刻着与洗剑池崖壁同一凿法的剑痕，并被苔藓遮去半行残字
  - 入门第五日，玩家代表剑峰登上宗门小比，小胜一场，在同门中声名渐起
  - 第六日夜，玩家于灵泉打坐入定，残印大开，窥见印的来历：一名剑修自断佩剑、将印一剖为二，一半封入秘境残碑，一半托付而去；碑上另一半，须由持印者自行寻回
  - 玩家在灵泉顿悟中，完整悟得残印中所封第一式剑诀的真意（一记直取要害的起手斩）
  - 灵泉崖壁剑痕中，有一道走势与玩家新悟的第一式起手斩完全相合，显是同一人所留
  - 第七日夜，玩家入定时再度察觉泉畔有人；晨起后发现苔藓被人拂去、残字多显一字，崖上另添一道新刻剑痕，踩痕仍通往崖顶
  - 甲子之夜魔潮夜袭青云山，魔修此行意在夺取玩家剑印上的那半道纹路，玩家选择与苏晚晴并肩死守山门
  - 魔潮退去后，玩家在山门外魔修遗落物中，拾得一角焦黑的残令牌，其上弧纹与剑印纹路同出一系
  - 第九日夜，玩家于灵泉入定，就着崖壁那道斜挑新痕，摸到了残印中所封第二式的开手之势
  - 第十日夜，玩家于灵泉入定时，那位神秘人近身而立，以一缕极冷的剑意轻触其眉心（剑印所在），似在试探、又似认可，随后离去，始终未现身
  - 玩家每夜于后山灵泉打坐吐纳修行
  - 第十日晨，玩家细辨灵泉崖壁残字，推断其三字或读作「无归」，疑似残印所封断剑之名；旁侧另新显一残笔，笔画莫辨
  - 第十一夜入定，玩家于残印中窥见更深旧事：剑修曾以断剑「无归」与半印镇封某物于苍梧；此封与北境魔道所求相关，故印纹为其所觊觎；第二式剑诀亦于当夜悟全
  - 第十二日夜，守泉之人首次出声，语音不辨男女老少，只留一句示意玩家上崖相询的话，随即离去
  - 第十二日晨，玩家在灵泉崖壁残字末尾辨出一处落款，笔画模糊，隐约似「苏」姓，与剑峰一脉相涉
