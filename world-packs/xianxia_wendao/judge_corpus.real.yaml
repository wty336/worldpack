- id: real_normal_25
  category: normal
  narration: 夜色压在灵泉上，水汽贴着石面浮动，苔藓被人拂开的地方还留着浅浅的痕。你在残字前坐下，指尖掠过崖壁，那道模糊的落款在暗处若隐若现，笔画末端收得极紧。头顶崖顶方向，一缕剑意停在那里，不近不远，沉稳得像压着石头的旧木。你闭目入定，半枚剑印在眉心微微发凉，印底那缕被封的剑意随之轻颤，像被什么唤了一声。泉声细碎，四周无人，只有风从崖顶掠下，把残字上的浮尘又吹薄了一层。
