name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      # 注：原步骤名写死 "784 items"，早已过期且会掩盖"文件没入库导致测试静默变少"。
      # 数量随微调线归档变动（843 → 633），故不再写进步骤名。
      - name: Run tests (offline)
        run: uv run pytest -q

      - name: Validate all world packs (offline)
        run: |
          for pack in world-packs/*/; do
            echo "::group::check-worldpack $pack"
            uv run python -m game_agent check-worldpack "$pack"
            echo "::endgroup::"
          done
