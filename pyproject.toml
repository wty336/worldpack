[project]
name = "game-agent"
version = "0.1.0"
description = "文字对话养成游戏引擎：一个引擎适配所有背景（古代、玄幻……）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["game_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
